<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার Daily Routine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"></div>
<main>
  <h1 id="clock"></h1>
  <div class="sub" id="date"></div>
  <button id="bell" class="bell"></button>
  <div class="tabs" id="tabs"></div>
  <div id="nowbox"></div>
  <h2>এই দিনের routine</h2>
  <ul class="tl" id="tl"></ul>
  <h2>Daily tasks <span class="pg" id="pg"></span></h2>
  <div id="tasks"></div>
  <div class="add"><input id="ti" placeholder="নতুন কাজ লিখুন (assignment, project...)"><button id="ta">Add</button></div>
</main>
<script src="script.js"></script>
</body>
</html>
